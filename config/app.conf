[app]
device_name=%(DEVICE_NAME)s
cronitor_monitor_key=%(CRONITOR_MONITOR_KEY)s
paging_enabled=%(PAGING_ENABLED)s

[alert_thresholds]
minimum_bms_count = %(MINIMUM_BMS_COUNT)s
# Optional overall-load alert overrides (code defaults apply when absent):
# load_warning_w = %(LOAD_WARNING_W)s
# load_shed_w = %(LOAD_SHED_W)s
# load_shed_cooldown_seconds = %(LOAD_SHED_COOLDOWN_SECONDS)s
# load_critical_w = %(LOAD_CRITICAL_W)s
# load_critical_resolve_seconds = %(LOAD_CRITICAL_RESOLVE_SECONDS)s
# generation_average_seconds = %(GENERATION_AVERAGE_SECONDS)s
# overcast_cooldown_seconds = %(OVERCAST_COOLDOWN_SECONDS)s

[creds]
cronitor=Cronitor/password
sentry_dsn=Sentry/__APP_NAME__/dsn

[metrics]
network_port=9401
debug_csv=%(METRICS_DEBUG_CSV)s

[mqtt]
server_address = %(MQTT_SERVER_ADDRESS)s
topic_prefix = %(MQTT_TOPIC_PREFIX)s
switch_device_csv = %(MQTT_SWITCH_DEVICE_CSV)s

[bms]
logging_enabled = %(BMS_LOGGING_ENABLED)s
serial_port = %(BMS_SERIAL_PORT)s


[inverter]
logging_enabled = %(INVERTER_LOGGING_ENABLED)s
logger_address = %(INVERTER_LOGGER_ADDRESS)s
logger_port = %(INVERTER_LOGGER_PORT)s
logger_sn = %(INVERTER_LOGGER_SN)s
# Optional inverter poll backoff override (code default: 1.0 s):
# poll_backoff_seconds = %(INVERTER_POLL_BACKOFF_SECS)s

[weather]
coord_lat_lon = %(WEATHER_COORD)s
# Optional weather poll interval override (code default: 60 s):
# poll_interval_seconds = %(WEATHER_POLL_INTERVAL_SECS)s

[telegram]
enabled_users_csv = %(TELEGRAM_ENABLED_USERS_CSV)s
history_hours = %(TELEGRAM_HISTORY_HOURS)s
help_url = %(TELEGRAM_HELP_URL)s

[gemini]
# Optional text-to-image model override for the /imagine command
# (code default: gemini-3.1-flash-lite-image):
# model = %(GEMINI_MODEL)s
