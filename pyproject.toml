[project]
name = "app"
version = "0.1.0"
description = "Inverter Monitor"
readme = "README.md"
license-files = ["LICENSE"]
authors = [
    { name = "Tai Lucas", email = "tglucas@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "influxdb-client>=1.49.0",
    "libscrc>=1.8.1",
    "pagerduty>=6.3.0",
    "paho-mqtt>=2.1.0",
    "prometheus-client>=0.23.1",
    "pyserial>=3.5",
    "requests>=2.32.5",
    "sentry-sdk>=2.38.0",
    "tailucas-pylib[creds,monitoring,mq]>=0.7.1",
]

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.12.0",
    "mypy>=1.16",
]

[project.scripts]
aws_configure = "tailucas_pylib.tools.aws_configure:main"
config_interpol = "tailucas_pylib.tools.config_interpol:main"
cred_tool = "tailucas_pylib.tools.cred_tool:main"
yaml_interpol = "tailucas_pylib.tools.yaml_interpol:main"


[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = [
    "F",    # Pyflakes (catches undefined names, e.g. misspelled kwargs)
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "B",    # flake8-bugbear (B026: star-arg after keyword arg)
    "I",    # isort (import ordering)
    "UP",   # pyupgrade (modern Python)
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = [
    "influxdb_client.*",
    "paho.mqtt.*",
    "pagerduty.*",
    "prometheus_client.*",
    "sentry_sdk.*",
    "tailucas_pylib.*",
    "libscrc",
    "serial",
    "simplejson",
    "zmq",
]
ignore_missing_imports = true
