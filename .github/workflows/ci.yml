# Builds and publishes ghcr.io/<owner>/<repo>:<sha> and :latest.
#
# The image build is the real gate; ruff and mypy are cheap pre-checks that are
# clean on this project today (verified 2026-11-27). The deploy workflow pulls
# one immutable tag and maps it onto the host's CONTAINER_NAME, so neither .env
# nor the home-lab catalog needs to change.
#
# Trigger branch is `master` for this project, not `main`.
name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Lint and type check
        run: |
          set -euo pipefail
          uv sync
          uv run ruff check app
          uv run mypy app

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and publish off the default branch's PRs)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            LANG=en_ZA.UTF-8
            LANGUAGE=en_ZA
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=inverter-monitor
          cache-to: type=gha,mode=max,scope=inverter-monitor
